<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activa Uniformes | Subir Archivo</title>
    <link rel="icon" type="image/png" href="https://clustermodanorte.cccucuta.org.co/wp-content/uploads/2021/08/activa-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="dashboard.css"> 
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">ACTIVA UNIFORMES</div>
        <div class="navbar-links">
            <a href="index.html" class="nav-link active">Subir Archivo</a>
            <a href="dashboard.html" class="nav-link">Ver Documentos</a>
            <div class="user-profile">Usuario Actual</div>
        </div>
    </nav>

    <div class="container">
        <div class="upload-card">
            <div class="upload-header">
                <h2>Subir Nuevo Documento</h2>
                <p>Sube el archivo escaneado y asígnalo al departamento correspondiente.</p>
            </div>

            <form id="uploadForm">
                <div class="form-group">
                    <label for="departamentoSelect">Departamento de Destino:</label>
                    <select id="departamentoSelect" style="width: 100%;">
                        <option value="1">Contabilidad</option>
                        <option value="2">Producción</option>
                        <option value="3">Recursos Humanos</option>
                    </select>
                </div>

                <div class="file-drop-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
                    <p id="fileName">Arrastra tu archivo aquí o haz clic para explorar</p>
                    <input type="file" id="fileInput" accept=".pdf, .jpg, .png, .xlsx">
                </div>

                <button type="submit" class="btn-primary btn-upload">Subir a AWS S3</button>
            </form>
        </div>
    </div>

    <script>
       
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                fileNameDisplay.innerHTML = `<strong>${this.files[0].name}</strong> listo para subir.`;
                fileNameDisplay.style.color = 'var(--activa-red)';
            }
        });

        document.getElementById('uploadForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Próximamente: Este botón enviará el archivo a NestJS y lo guardará en AWS S3.");
        });
    </script>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const fileInput = document.getElementById('fileInput');
    if (fileInput.files.length === 0) {
        alert('Por favor selecciona un archivo.');
        return;
    }

    
    const formData = new FormData();
    
    formData.append('file', fileInput.files[0]);

   
    const token = localStorage.getItem('token');

    try {
        const respuesta = await fetch('http://localhost:3000/documents/upload', {
            method: 'POST',
            headers: {
                
                'Authorization': `Bearer ${token}`
            },
            body: formData
        });

        if (respuesta.ok) {
            alert('¡Documento subido exitosamente!');
            window.location.href = 'dashboard.html'; 
        } else {
            const errorData = await respuesta.json();
            alert('Error al subir el documento: ' + (errorData.message || 'No autorizado'));
        }
    } catch (error) {
        console.error('Error de conexión:', error);
        alert('No se pudo conectar con el servidor.');
    }
});


document.getElementById('fileInput').addEventListener('change', (e) => {
    const fileName = e.target.files[0] ? e.target.files[0].name : 'Arrastra tu archivo aquí o haz clic para explorar';
    document.getElementById('fileName').innerText = fileName;
});
    </script>
</body>
</html>
