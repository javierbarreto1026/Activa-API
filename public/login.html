<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activa Uniformes - Portal Corporativo</title>
   
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">ACTIVA <span>UNIFORMES</span></div>
        <p class="subtitle" id="formDesc">Portal de Gestión Documental</p>

       
        <div id="mensajeError" class="error-msg"></div>

  
        <form id="loginForm" onsubmit="procesarLogin(event)">
            <div class="form-group">
                <label>Correo corporativo</label>
                <input type="email" id="email" required placeholder="ejemplo@empresa.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <button type="submit" id="btnSubmit" class="btn-primary">Iniciar sesión</button>
            <button type="button" class="btn-secondary" onclick="toggleForms()">¿Necesitas actualizar tu contraseña?</button>
        </form>

        
        <form id="resetForm" onsubmit="procesarReset(event)">
            <div class="form-group">
                <label>Correo corporativo</label>
                <input type="email" id="resetEmail" required>
            </div>
            <div class="form-group">
                <label>Contraseña actual</label>
                <input type="password" id="resetOld" required>
            </div>
            <div class="form-group">
                <label>Nueva contraseña</label>
                <input type="password" id="resetNew" required>
            </div>
            
            <button type="submit" id="btnReset" class="btn-primary">Actualizar clave</button>
            <button type="button" class="btn-secondary" onclick="toggleForms()">Volver al inicio de sesión</button>
        </form>
    </div>

    <script>
        const errorDiv = document.getElementById('mensajeError');

        function toggleForms() {
            const login = document.getElementById('loginForm');
            const reset = document.getElementById('resetForm');
            const desc = document.getElementById('formDesc');
            
            errorDiv.style.display = 'none';

            if (login.style.display === 'none') {
                login.style.display = 'block';
                reset.style.display = 'none';
                desc.innerText = 'Portal de Gestión Documental';
            } else {
                login.style.display = 'none';
                reset.style.display = 'block';
                desc.innerText = 'Ingresa tus datos actuales y la nueva clave';
            }
        }

        async function procesarLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('btnSubmit');
            
            btn.innerHTML = 'Verificando...';
            btn.disabled = true;
            errorDiv.style.display = 'none';

            try {
                const respuesta = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });

                if (respuesta.ok) {
                    const data = await respuesta.json();
                    localStorage.setItem('usuarioActiva', data.usuario); 
                    window.location.href = 'dashboard.html';
                } else {
                    mostrarError('Usuario o contraseña incorrectos.');
                    btn.innerHTML = 'Iniciar sesión';
                    btn.disabled = false;
                }
            } catch (error) {
                mostrarError('Error de conexión con el servidor.');
                btn.innerHTML = 'Iniciar sesión';
                btn.disabled = false;
            }
        }

        function procesarReset(event) {
            event.preventDefault();
            mostrarError('La función de actualización está en desarrollo.');
        }

        function mostrarError(mensaje) {
            errorDiv.innerText = mensaje;
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
